[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unsw-nb15-ml-benchmark"
version = "0.1.0"
description = "Reproducible supervised and unsupervised ML benchmark for UNSW-NB15 intrusion detection."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "requests>=2.32",
  "streamlit>=1.38",
  "plotly>=5.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipykernel>=6.0", "nbformat>=5.7", "nbconvert>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
